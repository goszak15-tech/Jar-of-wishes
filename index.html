<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Банка семейных предсказаний</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: radial-gradient(circle at center, #1a2a6c, #0f172a);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Arial', sans-serif;
            user-select: none;
        }

        .container {
            position: relative;
            width: 90vw;
            max-width: 700px;
            aspect-ratio: 1 / 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        /* Контейнер для видео С РАМКОЙ */
        .video-wrapper {
            position: relative;
            width: 100%;
            height: 100%;
            cursor: pointer;
            z-index: 10;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            transition: transform 0.3s ease;
            
            /* ЗОЛОТАЯ РАМКА В СТИЛЕ ДЕТСКОГО АЛЬБОМА */
            background-color: #0b1120; /* Темный фон внутри рамки */
            border: 8px solid #d4af37; /* Золотая рамка */
            box-sizing: border-box;
            padding: 10px; /* Отступ от рамки до видео */
        }

        .video-wrapper:hover {
            transform: scale(1.02);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: contain; /* ВАЖНО: показываем видео ЦЕЛИКОМ, без обрезки */
            display: block;
            border-radius: 10px;
        }

        /* Надпись "Жми!" - только для первого раза */
        .tap-hint {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(212, 175, 55, 0.95);
            color: #0f172a;
            padding: 15px 30px;
            border-radius: 50px;
            font-size: 1.4rem;
            font-weight: bold;
            border: 3px solid #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: pulseHint 2s infinite;
            pointer-events: none;
            white-space: nowrap;
            z-index: 15;
            transition: opacity 0.5s ease;
        }

        .tap-hint.hidden {
            opacity: 0;
            pointer-events: none;
        }

        @keyframes pulseHint {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Бумажка с предсказанием */
        .paper {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0) rotate(10deg);
            width: 340px;
            min-height: 150px;
            background: linear-gradient(135deg, #fff9e6 0%, #ffeb3b 100%);
            border: 4px solid #d4af37;
            border-radius: 15px;
            padding: 25px;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.3rem;
            color: #222;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6);
            opacity: 0;
            pointer-events: none;
            z-index: 20;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .paper.show {
            transform: translate(-50%, -140%) scale(1) rotate(-2deg);
            opacity: 1;
            pointer-events: auto;
        }

        .paper-text {
            font-style: italic;
            line-height: 1.5;
            font-weight: 600;
        }

        /* Кнопка "Еще!" */
        .btn-more {
            margin-top: 30px;
            background: rgba(212, 175, 55, 0.95);
            color: #0f172a;
            border: 2px solid #fff;
            padding: 14px 35px;
            border-radius: 50px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.4);
            transition: transform 0.2s, opacity 0.3s;
            opacity: 0;
            pointer-events: none;
            z-index: 30;
        }

        .btn-more.visible {
            opacity: 1;
            pointer-events: auto;
        }

        .btn-more:hover {
            transform: scale(1.1);
        }

        /* Постоянная подсказка внизу */
        .bottom-hint {
            position: absolute;
            bottom: -40px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(212, 175, 55, 0.6);
            font-size: 0.9rem;
            white-space: nowrap;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .bottom-hint.hidden {
            opacity: 0;
        }

        /* Снежинки */
        .snowflake {
            position: absolute;
            top: -10px;
            color: white;
            font-size: 1.5em;
            animation: fall linear infinite;
            z-index: 1;
            pointer-events: none;
            text-shadow: 0 0 5px rgba(255,255,255,0.8);
        }

        @keyframes fall {
            0% { transform: translateY(-10vh) translateX(0); opacity: 1; }
            100% { transform: translateY(110vh) translateX(20px); opacity: 0.3; }
        }
    </style>
</head>
<body>

    <audio id="rustle-sound" src="rustle.mp3"></audio>
    <audio id="bg-music" src="music.mp3" loop></audio>

    <div class="container">
        <div class="video-wrapper" id="video-wrapper" onclick="pullPrediction()">
            <video id="jar-video" muted playsinline preload="auto">
                <source src="jar-video.mp4" type="video/mp4">
            </video>
            <div class="tap-hint" id="tap-hint">👆 ЖМИ НА БАНКУ! 👆</div>
        </div>

        <div class="paper" id="paper">
            <span class="paper-text" id="prediction-text"></span>
        </div>

        <button class="btn-more" id="btn-more" onclick="resetJar(event)">🎲 Еще одно!</button>
        
        <div class="bottom-hint" id="bottom-hint">✨ Нажми на банку для нового предсказания ✨</div>
    </div>

    <script>
        // ⏱️ НАСТРОЙКА ЗАДЕРЖКИ
        const PAPER_DELAY = 1500; 

        const predictions = [
            "Папа наконец-то научится печь блины без комочков! 🥞",
            "Дед Мороз принесет именно тот подарок, который ты загадывал(а)! 🎁",
            "Кто-то из нас начнет учить новый язык (и это будет круто)! 🗣️",
            "Наша семья станет еще дружнее, чем сейчас! ❤️",
            "У нас появится новая семейная традиция! 🎉",
            "Твой смех будет звучать чаще, чем в прошлом году! 😄",
            "Тебя ждет сюрприз, от которого захочется прыгать от радости! 🦘",
            "Этот год подарит тебе момент, когда время остановится от счастья! ✨",
            "Кто-то очень любит тебя, даже если молчит об этом! 💕",
            "В этом году тебя ждет приятный сюрприз от близкого человека! 🎁",
            "Твоя самая смелая идея скоро начнет воплощаться! 💡",
            "Готовься к путешествию, о котором ты давно мечтал(а)! ✈️",
            "Кто-то из семьи тайно гордится тобой больше, чем говорит! ❤️",
            "Этот год принесет тебе новый талант, о котором ты даже не подозревал(а)! 🎨",
            "Удача будет на твоей стороне в самом неожиданном деле! 🍀",
            "Тебя ждет вечер, который запомнится на всю жизнь! 🌟",
            "Твой смех станет чьим-то любимым звуком в этом году! 😄",
            "Скоро ты найдешь то, что давно искал(а)! 🔍",
            "Этот год будет полон моментов, когда хочется сказать «спасибо» жизни! 🙏",
            "Нас ждёт вечер настольных игр, который мы будем вспоминать весь год с улыбкой! 🎲",
            "Мама (или кто-то из нас) приготовит такое блюдо, что все попросят добавки дважды! 🍲",
            "В этом году нас ждёт как минимум один идеальный ленивый выходной под пледом с вкусняшками! 🛋️",
            "В доме появится новый зелёный друг, который переживёт все наши поливы! 🌱",
            "Мы сделаем такое классное семейное фото, что его захочется распечатать и повесить на стену! 📸",
            "Тебя ждёт душевный разговор на кухне до самой ночи, после которого станет очень легко на душе! ☕",
            "В этом году все съеденные тобой мандарины и конфеты пойдут исключительно в хорошее настроение! 🍊",
            "Ты наконец-то найдёшь второй носок, который загадочно исчез ещё в прошлом году! 🧦",
            "У тебя откроется суперспособность угадывать, что лежит в подарке, даже не разворачивая его! 🕵️",
            "В этом году ты ни разу не проспишь ничего по-настоящему важного (ну, почти)! ⏰",
            "Тебя ждёт спонтанный танец под любимую песню прямо посреди обычного дня! 💃",
            "Ты случайно найдёшь забытую купюру в кармане старой куртки или сумки! 💸",
            "В этом году сбудется твоя старая мечта, и тут же появится новая — ещё интереснее! 🌠",
            "Ты услышишь комплимент, который поднимет твою самооценку до небес! 🚀",
            "С тобой случится совпадение, которое заставит поверить в настоящее волшебство! 🪄",
            "Ты откроешь для себя историю, от которой невозможно будет оторваться! 📚",
            "Ты справишься с делом, которое раньше казалось слишком сложным! 🏆",
            "Тебя ждёт неожиданная и очень приятная встреча с человеком, по которому ты скучал(а)! 🤗",
            "У тебя будет день, когда всё сложится само собой, как по взмаху волшебной палочки! ✨",
            "Самое заветное желание, загаданное под бой курантов, уже начало исполняться! 🥂"
        ];

        let lastIndex = -1;
        let isAnimating = false;
        let isFirstClick = true;
        
        const videoWrapper = document.getElementById('video-wrapper');
        const jarVideo = document.getElementById('jar-video');
        const paper = document.getElementById('paper');
        const predictionText = document.getElementById('prediction-text');
        const btnMore = document.getElementById('btn-more');
        const tapHint = document.getElementById('tap-hint');
        const bottomHint = document.getElementById('bottom-hint');
        const rustleSound = document.getElementById('rustle-sound');
        const bgMusic = document.getElementById('bg-music');

        function playRustle() {
            rustleSound.currentTime = 0;
            rustleSound.volume = 0.6;
            rustleSound.play().catch(e => console.log(e));
        }

        function startMusic() {
            if (bgMusic.paused) {
                bgMusic.volume = 0.3;
                bgMusic.play().catch(e => console.log(e));
            }
        }

        function pullPrediction() {
            if (isAnimating || paper.classList.contains('show')) return;
            
            isAnimating = true;
            startMusic();

            if (isFirstClick) {
                tapHint.classList.add('hidden');
                isFirstClick = false;
            }

            let randomIndex;
            do {
                randomIndex = Math.floor(Math.random() * predictions.length);
            } while (randomIndex === lastIndex && predictions.length > 1);
            lastIndex = randomIndex;

            jarVideo.currentTime = 0;
            jarVideo.play().then(() => {
                playRustle();
                
                setTimeout(() => {
                    predictionText.innerText = predictions[randomIndex];
                    paper.classList.add('show');
                    
                    setTimeout(() => {
                        btnMore.classList.add('visible');
                        isAnimating = false;
                    }, 500);
                }, PAPER_DELAY);
                
            }).catch(e => {
                console.log("Ошибка воспроизведения:", e);
                isAnimating = false;
            });
        }

        function resetJar(event) {
            event.stopPropagation(); 
            
            paper.classList.remove('show');
            btnMore.classList.remove('visible');
            jarVideo.currentTime = 0;
            
            bottomHint.classList.remove('hidden');
        }

        // Снег
        function createSnow() {
            const snowflakes = ['❄', '❅', '❆', '✻', '✼'];
            for (let i = 0; i < 30; i++) {
                let flake = document.createElement('div');
                flake.className = 'snowflake';
                flake.innerText = snowflakes[Math.floor(Math.random() * snowflakes.length)];
                flake.style.left = Math.random() * 100 + 'vw';
                flake.style.animationDuration = (Math.random() * 3 + 2) + 's';
                flake.style.animationDelay = Math.random() * 5 + 's';
                flake.style.fontSize = (Math.random() * 10 + 10) + 'px';
                document.body.appendChild(flake);
            }
        }
        createSnow();
    </script>

</body>
</html>
